[package]
name = "tailor-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Tailor — a visual interface builder for gpui and guise."

# The dev binary is `tailordev` so a dev build never collides with an installed
# `tailor`. Release packaging installs this same binary as `tailor`.
[[bin]]
name = "tailordev"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
guise-ui = { workspace = true }
tailor-model = { workspace = true }
tailor-codegen = { workspace = true }
tailor-store = { workspace = true }
tailor-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Entity-level tests (`#[gpui::test]` + `TestAppContext`) — the same harness
# guise's own tests run on. The pure logic lives in `tailor-model` and
# `tailor-codegen`; what needs a live app is the workbench's commands.
gpui = { version = "0.2.2", features = ["test-support"] }
