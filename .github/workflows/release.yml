name: Release

# Runs when a version tag (v*) is pushed, or manually for a given tag. It
# releases Tailor: a signed, notarized .app in a .dmg, with notes lifted from
# the CHANGELOG section for the version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0-beta)"
        required: true

permissions:
  contents: write

jobs:
  # Create the GitHub Release, with notes from the CHANGELOG.
  #
  # Created as a draft and published by the `publish` job once the DMG has
  # been uploaded to it. A published release is what `releases/latest` reports,
  # so publishing up front would advertise a version for the length of a
  # notarization run with none of its assets attached yet.
  github-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Tailor's history was carried out of the guise repository with
      # `git filter-repo`, which brought guise's tags with it — twenty-eight of
      # them, on that project's version line, pointing at commits from before
      # Tailor existed. Pushing one by accident would have built a five-year-old
      # tree and released it under a Tailor version number.
      #
      # They are gone now, but the shape of the mistake is not: a tag is a name
      # anyone can put anywhere, and this job turns it into a download. So the
      # tag has to be on `main`.
      - name: The tag must be on main
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::$TAG is not an ancestor of main — refusing to release it."
            echo "It points at $(git log -1 --oneline "$TAG")."
            exit 1
          fi
          echo "$TAG is on main: $(git log -1 --oneline "$TAG")"

      # Prefer the hand-written CHANGELOG section for this version — a list of
      # commit subjects is not release notes. Falls back to generated notes for
      # a tag the changelog doesn't cover.
      - name: Extract the changelog section
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          if [ -f CHANGELOG.md ] && awk -v v="## $VERSION" '$0 ~ "^"v" " || $0 == v {found=1} END {exit !found}' CHANGELOG.md; then
            awk -v v="## $VERSION" '
              $0 ~ "^"v" " || $0 == v {inside=1; next}
              inside && /^## / {exit}
              inside {print}
            ' CHANGELOG.md > release-notes.md
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # A semver pre-release (v0.1.0-beta) is marked as one, so it never
          # becomes what `releases/latest` reports.
          PRERELEASE=""
          case "${TAG#v}" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          elif [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag --draft $PRERELEASE
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --draft $PRERELEASE
          fi

  # Tailor as a macOS app: build, sign, notarize, staple, package.
  macos:
    needs: github-release
    runs-on: macos-latest
    # Signing and notarization are gated separately, because they need different
    # credentials and one can be set up without the other. With a Developer ID
    # the app is signed with a hardened runtime; with notary credentials on top
    # it is also notarized and stapled, which is what stops Gatekeeper warning
    # on a downloaded build. With neither, the build falls back to an ad-hoc
    # signature — it runs on the machine that made it and nowhere else.
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.github-release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Import the Developer ID Application cert into a temporary keychain so
          # codesign can find it. The keychain is wiped when the job ends.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build + bundle (.app)
        run: |
          export CODESIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          scripts/bundle.sh

      - name: Notarize app
        if: env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/Tailor.app "$RUNNER_TEMP/Tailor.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Tailor.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/Tailor.app

      - name: Package (.dmg)
        run: |
          export CODESIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          scripts/dmg.sh

      - name: Notarize dmg
        if: env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/Tailor.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/Tailor.dmg

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 dist/Tailor.app
          test -x dist/Tailor.app/Contents/MacOS/tailor
          test -x dist/Tailor.app/Contents/MacOS/tailor-mcp
          test -f dist/Tailor.app/Contents/Resources/icon.icns
          if [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
            echo "::warning::Ad-hoc build — unsigned and not notarized; Gatekeeper will refuse a downloaded copy."
          elif [ -z "${APPLE_APP_PASSWORD}" ]; then
            echo "::warning::Signed but not notarized (no APPLE_APP_PASSWORD) — Gatekeeper will still warn on a downloaded copy."
          fi

      - name: Upload DMG
        run: gh release upload "${{ needs.github-release.outputs.tag }}" dist/Tailor.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Flip the draft live once the DMG is attached. `!cancelled()` rather than
  # `always()`: always() is also true for a cancelled run, which would publish a
  # release whose remaining jobs were deliberately stopped.
  publish:
    runs-on: ubuntu-latest
    needs: [github-release, macos]
    if: |
      !cancelled()
      && needs.github-release.result == 'success'
      && needs.macos.result == 'success'
    steps:
      - name: Publish the release
        run: gh release edit "${{ needs.github-release.outputs.tag }}" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
