name: Release

# Releasing is bumping the version in Cargo.toml and pushing to main. The tag
# is made here rather than by hand, which is the point: a tag typed into a
# terminal is a name anyone can put anywhere, and this workflow turns one into
# a signed, notarized download. (Tailor's history came out of the guise
# repository with `git filter-repo`, which brought twenty-eight of that
# project's tags with it — `git tag v0.2.0` did nothing at all and the push
# put a five-year-old commit on the remote under Tailor's next version.)
#
# The notes are lifted from the matching `## <version>` section of the
# CHANGELOG, so that section *is* the release notes.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Release when the workspace version has no tag yet. Idempotent for both a
  # push and a manual run, where a HEAD~1 diff would miss the second.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the workspace version
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\([0-9][^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::No version in Cargo.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "${TAG} is already released — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Create the GitHub Release, with notes from the CHANGELOG.
  #
  # Created as a draft and published by the `publish` job once the DMG has
  # been uploaded to it. A published release is what `releases/latest` reports,
  # so publishing up front would advertise a version for the length of a
  # notarization run with none of its assets attached yet.
  github-release:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    outputs:
      tag: ${{ needs.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag this commit
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          git tag -a "$TAG" -m "Version ${{ needs.check-version.outputs.version }}"
          git push origin "$TAG"

      # Prefer the hand-written CHANGELOG section for this version — a list of
      # commit subjects is not release notes. Falls back to generated notes for
      # a tag the changelog doesn't cover.
      - name: Extract the changelog section
        id: notes
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          if [ -f CHANGELOG.md ] && awk -v v="## $VERSION" '$0 ~ "^"v" " || $0 == v {found=1} END {exit !found}' CHANGELOG.md; then
            awk -v v="## $VERSION" '
              $0 ~ "^"v" " || $0 == v {inside=1; next}
              inside && /^## / {exit}
              inside {print}
            ' CHANGELOG.md > release-notes.md
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          # A semver pre-release (v0.1.0-beta) is marked as one, so it never
          # becomes what `releases/latest` reports.
          PRERELEASE=""
          case "${TAG#v}" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          elif [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag --draft $PRERELEASE
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --draft $PRERELEASE
          fi

  # Tailor as a macOS app: build, sign, notarize, staple, package.
  macos:
    needs: [check-version, github-release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    # Signing and notarization are gated separately, because they need different
    # credentials and one can be set up without the other. With a Developer ID
    # the app is signed with a hardened runtime; with notary credentials on top
    # it is also notarized and stapled, which is what stops Gatekeeper warning
    # on a downloaded build. With neither, the build falls back to an ad-hoc
    # signature — it runs on the machine that made it and nowhere else.
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.github-release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Import the Developer ID Application cert into a temporary keychain so
          # codesign can find it. The keychain is wiped when the job ends.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build + bundle (.app)
        run: |
          export CODESIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          scripts/bundle.sh

      - name: Notarize app
        if: env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/Tailor.app "$RUNNER_TEMP/Tailor.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Tailor.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/Tailor.app

      - name: Package (.dmg)
        run: |
          export CODESIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          scripts/dmg.sh

      - name: Notarize dmg
        if: env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/Tailor.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/Tailor.dmg

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 dist/Tailor.app
          test -x dist/Tailor.app/Contents/MacOS/tailor
          test -x dist/Tailor.app/Contents/MacOS/tailor-mcp
          test -f dist/Tailor.app/Contents/Resources/icon.icns
          if [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
            echo "::warning::Ad-hoc build — unsigned and not notarized; Gatekeeper will refuse a downloaded copy."
          elif [ -z "${APPLE_APP_PASSWORD}" ]; then
            echo "::warning::Signed but not notarized (no APPLE_APP_PASSWORD) — Gatekeeper will still warn on a downloaded copy."
          fi

      - name: Upload DMG
        run: gh release upload "${{ needs.github-release.outputs.tag }}" dist/Tailor.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Flip the draft live once the DMG is attached. `!cancelled()` rather than
  # `always()`: always() is also true for a cancelled run, which would publish a
  # release whose remaining jobs were deliberately stopped.
  publish:
    runs-on: ubuntu-latest
    needs: [check-version, github-release, macos]
    if: |
      !cancelled()
      && needs.check-version.outputs.changed == 'true'
      && needs.github-release.result == 'success'
      && needs.macos.result == 'success'
    steps:
      - name: Publish the release
        run: gh release edit "${{ needs.github-release.outputs.tag }}" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # `brew install --cask wess/packages/tailor`, the same tap the other apps
  # use. Runs after `publish` because the cask needs the DMG's digest, and the
  # DMG is only downloadable once the release is live.
  homebrew:
    runs-on: ubuntu-latest
    needs: [check-version, publish]
    if: |
      !cancelled()
      && needs.check-version.outputs.changed == 'true'
      && needs.publish.result == 'success'
      && !contains(needs.check-version.outputs.version, '-')
    steps:
      - name: Download the DMG and take its digest
        id: dmg
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          URL="https://github.com/wess/tailor/releases/download/v${VERSION}/Tailor.dmg"
          for attempt in $(seq 1 30); do
            if curl -fsSL -o /tmp/Tailor.dmg "${URL}" 2>/dev/null; then
              break
            fi
            echo "Waiting for Tailor.dmg… (${attempt}/30)"
            sleep 10
          done
          # `curl -f` still creates the file on an HTTP error, so without this
          # a run that exhausted every retry would hash a zero-byte file and
          # publish the empty digest as a working cask.
          if [ ! -s /tmp/Tailor.dmg ]; then
            echo "::error::Tailor.dmg never became downloadable from ${URL}"
            exit 1
          fi
          echo "sha=$(sha256sum /tmp/Tailor.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: wess/homebrew-packages
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write the cask
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/tailor.rb << 'RUBY'
          cask "tailor" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"

            url "https://github.com/wess/tailor/releases/download/v#{version}/Tailor.dmg"
            name "Tailor"
            desc "Visual interface builder for gpui: design it, run it, take the Rust"
            homepage "https://github.com/wess/tailor"

            depends_on macos: :big_sur

            app "Tailor.app"
            # The MCP server ships beside the app inside the bundle; this is
            # what puts it on PATH for an agent that wants to drive Tailor.
            binary "#{appdir}/Tailor.app/Contents/MacOS/tailor-mcp"

            zap trash: [
              "~/Library/Application Support/tailor",
              "~/Library/Preferences/io.wess.tailor.plist",
              "~/Library/Saved Application State/io.wess.tailor.savedState",
            ]
          end
          RUBY
          sed -i "s/VERSION_PLACEHOLDER/${{ needs.check-version.outputs.version }}/g" tap/Casks/tailor.rb
          sed -i "s/SHA_PLACEHOLDER/${{ steps.dmg.outputs.sha }}/g" tap/Casks/tailor.rb

      - name: Push it
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/tailor.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged — nothing to push."
          else
            git commit -m "Update tailor to v${{ needs.check-version.outputs.version }}"
            git push
          fi
