# Its own workspace on purpose: this crate builds for `wasm32-wasip2` and is
# compiled by Zed, not by `cargo build --workspace`. Leaving it in the guise
# workspace would put a wasm-only dependency in the lockfile CI builds
# `--locked` against.
[workspace]

[package]
name = "zed-tailor"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"
